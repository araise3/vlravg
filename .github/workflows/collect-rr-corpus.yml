name: Collect act RR corpus

on:
  # Hourly triggers keep one run queued behind the active one, so collection
  # runs back to back. GitHub delayed or dropped many four-hourly triggers,
  # leaving only 3-4 runs a day; the 6-8 hour polling intervals need more.
  # A newer queued trigger replaces an older queued one (shown as cancelled).
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      detail_limit:
        description: 'Maximum missing match feature rows per run (0–5000)'
        default: '1500'
      runtime_minutes:
        description: 'Run budget including reporting (10–210 minutes)'
        default: '180'

# Henrik jobs share HENRIK_WORKFLOW_KEY, separate from the public site's key.
# Save it as a secret in GitHub Actions and Cloudflare Pages production.
# Serialize manual and scheduled collection runs against the shared key.
concurrency:
  group: refresh-rr-history
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture active accounts, scout recent opponents, and fill match evidence
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          HENRIK_WORKFLOW_KEY: ${{ secrets.HENRIK_WORKFLOW_KEY }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://vlravg1.pages.dev' }}
          DETAIL_LIMIT: ${{ inputs.detail_limit || '1500' }}
          RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '180' }}
        run: node .github/scripts/collect-rr-corpus.mjs
      - name: Save corpus coverage and collection failures
        if: ${{ always() && vars.RR_REPORT_EXPORT_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rr-corpus-coverage
          path: .local/rr-corpus/collection-report.json
          retention-days: 90
