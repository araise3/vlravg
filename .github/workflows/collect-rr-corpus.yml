name: Collect act RR corpus

on:
  # Collection is continuous: each run polls for up to ~5.5 hours (GitHub's job
  # limit is 6) and starts the next one itself. The hourly trigger is the
  # backup when a run dies or GitHub drops the dispatch; it waits in the
  # concurrency group, and a newer queued trigger replaces an older one (shown
  # as cancelled). See docs/rr-collector-gap-healing.md.
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      detail_limit:
        description: 'Match feature rows loaded per batch when calls are spare (0–5000)'
        default: '500'
      runtime_minutes:
        description: 'Run budget including reporting (10–345 minutes)'
        default: '330'

# Henrik jobs share HENRIK_WORKFLOW_KEY, separate from the public site's key.
# Save it as a secret in GitHub Actions and Cloudflare Pages production.
# Serialize manual and scheduled collection runs against the shared key.
concurrency:
  group: refresh-rr-history
  cancel-in-progress: false
permissions:
  contents: read
  actions: write # start the next run
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Poll due accounts, heal gaps from stored history, and fill match evidence
        id: collect
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          HENRIK_WORKFLOW_KEY: ${{ secrets.HENRIK_WORKFLOW_KEY }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://vlravg1.pages.dev' }}
          DETAIL_LIMIT: ${{ inputs.detail_limit || '500' }}
          RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '330' }}
        run: node .github/scripts/collect-rr-corpus.mjs
      - name: Save corpus coverage and collection report
        if: ${{ always() && vars.RR_REPORT_EXPORT_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rr-corpus-coverage
          path: .local/rr-corpus/collection-report.json
          retention-days: 90
      # Runs after any run that did not stop on a configuration or storage
      # error. The new run waits in the concurrency group until this one ends
      # and uses the default inputs.
      - name: Start the next run
        if: ${{ always() && steps.collect.outputs.chain == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-rr-corpus.yml --ref "$GITHUB_REF_NAME"
