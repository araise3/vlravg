name: Parse uploaded replays

# Uploaded .vrf files are hostile input (docs/replay-import.md). Three jobs keep
# the key away from the parser: fetch (key) -> parse (no secrets, sandboxed
# container) -> submit (key, validates the parser's output as untrusted data).
# The parser is this repository's own fork, parser/ (docs/replay-parser.md).
on:
  # Started by the Function after each completed upload (GITHUB_DISPATCH_TOKEN,
  # Actions: write only). No inputs: every run just drains the queue.
  workflow_dispatch:
  # Daily sweep for a dispatch that failed or a claim that went stale.
  schedule:
    - cron: '23 4 * * *'
  # A decoder change re-queues uploads the previous decoder could not read.
  push:
    branches: [main]
    paths:
      - .github/workflows/parse-replays.yml
      - .github/scripts/replay-parse-sandbox.sh
      - parser/**

# One run at a time; a newer queued trigger replaces an older queued one.
concurrency:
  group: parse-replays
  cancel-in-progress: false
permissions: {}
env:
  # Upstream vrfkit v0.3.0, the base of parser/. Records name it as
  # decoder.revision; decoder.patch is the SHA-256 of parser/'s tracked tree
  # (`git ls-files -s parser`), so every source change is a new decoder build.
  DECODER_REVISION: b9496df61c40fa304d4f539689c1dd627804946e
  # The sandbox runtime: Debian bookworm, the glibc the parser is built for.
  RUNTIME_IMAGE: python:3.12-slim-bookworm@sha256:e697c81897302a4c4333bade000d98038fbb21eb064f8ee1fd42d02ebcd9d337
  RUST_IMAGE: rust:1.86-slim-bookworm@sha256:57d415bbd61ce11e2d5f73de068103c7bd9f3188dc132c97cef4a8f62989e944

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.claim.outputs.count }}
    steps:
      # Speed (docs/replay-import.md#pipeline-timing): only the scripts are
      # checked out (the index still lists parser/ for the digest), and the
      # runner's own Node runs them.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            lib
      - id: decoder
        run: echo "patch=$(git ls-files -s parser | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: claim
        env:
          HENRIK_WORKFLOW_KEY: ${{ secrets.HENRIK_WORKFLOW_KEY }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://vlravg1.pages.dev' }}
          DECODER_PATCH: ${{ steps.decoder.outputs.patch }}
        run: node .github/scripts/replay-fetch.mjs replay-work
      - if: steps.claim.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: replays
          path: replay-work/replays
          retention-days: 1
          # A .vrf is already compressed; zipping it again only costs time.
          compression-level: 0
      - if: steps.claim.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: claims
          path: replay-work/claims
          retention-days: 1

  # Runs alongside fetch on every run, so a decoder change is compiled once by
  # the push that makes it, never while an upload waits. The key names only
  # what the cached binary is built from: the workflow's other edits reuse it.
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      patch: ${{ steps.decoder.outputs.patch }}
    steps:
      # parser/ is checked out only when the cached binary is missing.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: decoder
        run: echo "patch=$(git ls-files -s parser | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: toolchain-cache
          key: replay-toolchain-v3-${{ steps.decoder.outputs.patch }}-${{ env.RUST_IMAGE }}
      # Built inside the same Debian release as the runtime image, so the
      # binary links against the glibc it will run with.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git sparse-checkout add parser
          docker run --rm -v "$PWD/parser:/src" -w /src "$RUST_IMAGE" cargo build --release --locked -p vrfkit
          mkdir -p toolchain-cache
          cp parser/target/release/vrfkit toolchain-cache/vrfkit
          # The builds this decoder registers, shown when a replay fails anyway.
          toolchain-cache/vrfkit builds > toolchain-cache/supported-builds.json
      - run: |
          mkdir -p toolchain
          cp -r toolchain-cache/. toolchain/
          cp .github/scripts/replay-parse-sandbox.sh .github/scripts/replay-unpack.py toolchain/
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: toolchain
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: decoder
          path: toolchain/supported-builds.json
          retention-days: 1

  parse:
    needs: [fetch, toolchain]
    if: needs.fetch.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # No secrets, no repository token scopes, no checkout, no cache.
    permissions: {}
    env:
      DECODER_PATCH: ${{ needs.toolchain.outputs.patch }}
    steps:
      # The image pull runs while the artifacts download; the second pull
      # waits for it (or for a pull of its own if the first one failed).
      - run: (docker pull -q "$RUNTIME_IMAGE" >/tmp/pull.log 2>&1 &)
      - uses: actions/download-artifact@v4
        with:
          name: replays
          path: replay-work/replays
      - uses: actions/download-artifact@v4
        with:
          name: toolchain
          path: toolchain
      - run: docker pull -q "$RUNTIME_IMAGE"
      - run: bash toolchain/replay-parse-sandbox.sh replay-work toolchain "$RUNTIME_IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: parsed
          path: replay-work/parsed
          retention-days: 1
          # Parquet and gzip are already compressed.
          compression-level: 0

  submit:
    needs: [fetch, toolchain, parse]
    # A failed parse job leaves its claims to go stale and be retried.
    if: needs.parse.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            lib
      - uses: actions/download-artifact@v4
        with:
          name: claims
          path: replay-work/claims
      - uses: actions/download-artifact@v4
        with:
          name: parsed
          path: replay-work/parsed
      - uses: actions/download-artifact@v4
        with:
          name: decoder
          path: replay-work/decoder
      - env:
          HENRIK_WORKFLOW_KEY: ${{ secrets.HENRIK_WORKFLOW_KEY }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://vlravg1.pages.dev' }}
          DECODER_PATCH: ${{ needs.toolchain.outputs.patch }}
        run: node .github/scripts/replay-submit.mjs replay-work
