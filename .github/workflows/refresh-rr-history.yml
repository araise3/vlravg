# Checks names and keeps persisted RR history growing without site visits.
#
# The /api/mmr-history route only ever sees a player when someone searches
# them, and HenrikDev only returns that player's most recent ~20 games. If a
# player plays 30 games between visits, the ones in the middle are lost for
# good. This job walks every player tracked in D1's rr_players table every
# 24h and re-pings the public endpoints, which do the fetch + merge + persist
# through the existing worker logic (rate limiting and quota pacing included).
#
# REQUIRED REPO SECRETS (Settings -> Secrets and variables -> Actions):
#   CF_API_TOKEN       Cloudflare API token with "D1: Read" on the account
#                      that owns the database (see functions/api/[[path]].js's
#                      header comment for the APP_DB binding)
#   CF_ACCOUNT_ID      Cloudflare account ID (Workers & Pages -> right sidebar)
#   CF_D1_DATABASE_ID  the APP_DB database ID (Workers & Pages -> D1 ->
#                      the database -> ID)
# OPTIONAL REPO VARIABLE:
#   SITE_ORIGIN        defaults to https://vlravg.pages.dev

name: Refresh names and RR history

on:
  schedule:
    # Once daily at 05:17 UTC, away from the busy start of the hour.
    # GitHub's scheduler is best-effort; checks can be delayed.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      max_players:
        description: 'Limit a manual verification run (0 = all players)'
        required: false
        default: '0'

concurrency:
  # Never let a slow run overlap the next scheduled one — that would double
  # the upstream request rate against a single shared API key.
  group: refresh-rr-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check names and refresh RR for every tracked player
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://vlravg.pages.dev' }}
          MAX_PLAYERS: ${{ inputs.max_players || '0' }}
        run: node .github/scripts/refresh-rr-history.mjs
