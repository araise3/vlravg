name: Snapshot RR research corpus
on:
  schedule:
    - cron: '13 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export a fresh reproducible corpus with permanent player hashes
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CORPUS_OUT: .local/rr-corpus/snapshot
        run: node scripts/export-rr-corpus.mjs
      - name: Compare models for acts superseded by a newer observed act
        run: python scripts/benchmark-rr-corpus.py .local/rr-corpus/snapshot/corpus.ndjson.gz --completed-acts --out .local/rr-corpus/snapshot/benchmarks
      - uses: actions/upload-artifact@v4
        with:
          name: rr-research-snapshot
          path: .local/rr-corpus/snapshot/
          retention-days: 90
